<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <h1>🎵 Music Player</h1>

        <div class="album">
            🎶
        </div>

        <h2 id="song-title">My Song</h2>

        <p id="artist">My Artist</p>

        <!-- Audio -->
        <audio id="audio"></audio>

        <!-- Time -->
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <!-- Progress bar -->
        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <!-- Controls -->
        <div class="controls">

            <button id="previous">⏮</button>

            <button id="play">▶</button>

            <button id="next">⏭</button>

        </div>

        <!-- Volume -->
        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

        <h3>Playlist</h3>

        <ul id="playlist">

            <li>My Song - My Artist</li>

        </ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
